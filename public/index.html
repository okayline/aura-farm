<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AURA FARMING SIMULATOR: NO CAP BATTLE EDITION 2027</title>
<meta name="description" content="Stand there. Look cool. Bluff. An async aura battle: put a style on the board and farm.">
<meta name="theme-color" content="#0b0a12">
<style>
  /* "Aura glow": near-black with purple light; every style glows in its colour (DRIP cyan, RIZZ pink, MOG violet). Text glows. Literal aura. */
  :root {
    --bg: #0b0a12; --panel: #171226; --panel2: #1b1530; --line: #3a2f5c;
    --ink: #f4f1ff; --mute: #c9b8ff; --dim: #a99ccf;
    --D: #5ad1ff; --H: #ff6fcf; --S: #b084ff;
    --meme: Impact, "Arial Black", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    min-height: 100vh; font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, #2a1650 0%, var(--bg) 60%) fixed, var(--bg);
  }
  .app { max-width: 430px; margin: 0 auto; padding: 16px 16px 118px; display: flex; flex-direction: column; gap: 14px; }
  .glow { text-shadow: 0 0 10px rgba(176,132,255,.75), 0 0 24px rgba(176,132,255,.35); }
  .big.glow { text-shadow: 0 0 8px rgba(176,132,255,.45); }   /* large white headings: a softer glow */
  .meme { font-family: var(--meme); letter-spacing: .5px; text-transform: uppercase; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .title { font-family: var(--meme); font-size: 19px; line-height: 1.05; text-shadow: 0 0 8px rgba(176,132,255,.6), 0 0 16px rgba(255,111,207,.3); }
  .title small { display: block; font-size: 11px; color: var(--mute); letter-spacing: 1px; text-shadow: 0 0 8px #b084ff; }
  .me { text-align: right; font-size: 12px; color: var(--mute); }
  .me b { color: var(--ink); font-size: 15px; text-shadow: 0 0 10px #ff6fcf; }
  button { font: inherit; color: var(--ink); cursor: pointer; }
  .link { background: none; border: 0; padding: 0; color: var(--mute); text-decoration: underline; font-size: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .small { font-size: 12px; color: var(--mute); }
  .big { font-family: var(--meme); font-size: 22px; }
  .halo { width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 24px; background: var(--panel2); transition: box-shadow .4s; }
  .pics { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-top: 8px; }   /* the profile pics to pick from (you screen) */
  .pics button { min-width: 0; height: 40px; padding: 0; font-size: 22px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); }
  .pics button.on { border-color: var(--H); box-shadow: 0 0 10px rgba(255,111,207,.6); }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .seal { margin-top: 10px; color: var(--dim); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; word-break: break-all; }   /* a finished farm's ledger entry, in full */
  .cards.beats { text-align: center; margin-top: -4px; }   /* "beats 😏" under each style card */
  .card { position: relative; height: 118px; border-radius: 14px; background: var(--panel); border: 2px solid var(--c, var(--line));
          box-shadow: 0 0 16px color-mix(in srgb, var(--c, transparent) 60%, transparent); padding: 8px 10px;
          display: flex; flex-direction: column; justify-content: space-between; text-align: left; color: var(--ink); }
  .card .r { font-family: var(--meme); letter-spacing: .5px; font-size: 16px; color: var(--c); text-shadow: 0 0 8px var(--c); }
  .card .e { font-size: 40px; text-align: center; padding-bottom: 20px; }   /* an empty line under the emoji */
  .card.on { outline: 3px solid var(--ink); outline-offset: 2px; box-shadow: 0 0 26px var(--c); }
  .duel { display: flex; flex-direction: column; align-items: center; gap: 18px; margin: 12px 0; }
  .face { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .face .card { width: 170px; }
  .face.lost { filter: grayscale(1); opacity: .6; }
  /* the reveal, right after you FLEX (played by reveal.js): their card starts face down and flips over */
  .slot { position: relative; perspective: 700px; }
  .slot .card { backface-visibility: hidden; }
  .card.back { position: absolute; inset: 0; z-index: 1; --c: var(--S); display: grid; place-items: center; place-content: center; font-family: var(--meme); font-size: 46px;
               text-shadow: 0 0 14px var(--S), 0 0 26px var(--H); background: repeating-linear-gradient(45deg, #1d1533 0 10px, #241a40 10px 20px); }
  .fx { position: fixed; inset: 0; pointer-events: none; z-index: 10; }   /* the emoji and bits that fly between the cards */
  .fx > div { position: absolute; left: 0; top: 0; line-height: 1; translate: -50% -50%; }
  .shard { color: var(--D); font-size: 14px; text-shadow: 0 0 8px var(--D); }
  .cap { font-family: var(--meme); font-size: 22px; text-align: center; min-height: 28px; margin: 22px 0; text-shadow: 0 0 14px currentColor; }   /* a blank line above the line and under the caption */
  .cap .bit { display: inline-block; vertical-align: middle; }   /* the big amount centred against AURA FARMED */
  .cap .amt { font-size: 30px; }   /* +100,000 aura */
  .cap .why { font: 700 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); text-shadow: 0 0 10px rgba(176,132,255,.75); }
  .time { font-family: var(--meme); font-size: 30px; margin: 8px 0 10px; }
  .bar { height: 6px; border-radius: 999px; background: var(--panel2); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #b084ff, #ff6fcf); }
  .detail.wait { visibility: hidden; }
  details.panel > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; font-weight: 700; letter-spacing: .3px; }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary::after { content: "▸"; color: var(--mute); }
  details.panel[open] > summary::after { content: "▾"; }
  details.panel[open] > summary { margin-bottom: 6px; }
  details.panel > summary + .kv { border-top: 0; }
  .kv { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0; font-size: 13px; border-top: 1px solid var(--line); }
  .kv:first-child { border-top: 0; }
  .kv span:first-child { color: var(--mute); white-space: nowrap; }
  .kv span:last-child { text-align: right; }
  .go { width: 100%; height: 54px; border-radius: 14px; border: 0; background: linear-gradient(135deg, #b084ff, #ff6fcf); font-family: var(--meme); font-size: 19px; letter-spacing: .5px; text-shadow: 0 0 6px rgba(255,255,255,.35); box-shadow: 0 0 22px rgba(255,111,207,.45); }
  .go:disabled { opacity: .4; }
  .chip { border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 6px 10px; font-size: 13px; }
  .keys { gap: 6px; }
  .keys .chip { font-size: 12px; white-space: nowrap; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item.home { padding: 17px 16px; border-radius: 16px; font-size: 18px; } .item.home .small { font-size: 14px; }   /* the farms on the home screen, a size up */
  .item { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; width: 100%; text-align: left; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 4px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background: rgba(11,10,18,.92); border-top: 1px solid var(--line); backdrop-filter: blur(8px); }
  .tab { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 10px 4px 8px; font-size: 16px; white-space: nowrap; color: var(--dim); border-radius: 12px; }
  .tab .ti { font-size: 28px; line-height: 1; }   /* the emoji above its name */
  .tab.on { color: var(--ink); font-weight: 700; text-shadow: 0 0 10px #b084ff; background: var(--panel2); }
  .err { color: #ffb3b3; text-align: center; font-size: 13px; min-height: 18px; }
  .entry { font-size: 13px; }
  .entry .meme { font-size: 16px; }
  code { font-size: 11px; color: var(--dim); word-break: break-all; }
</style>
</head>
<body>
<div class="app" id="app"><p class="small">Loading…</p></div>
<nav class="tabs" id="tabs"></nav>
<script type="module" src="app.js"></script>
</body>
</html>
